<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.R.E. | AI-Proofer</title>
    <style>
        :root {
            --bg-color: #f7f5fb;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --pink-accent: #e8a2be;
            --red-accent: #ff5c5c;
            --blue-accent: #b5c7ed;
            --yellow-accent: #fcf6bd;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px -10px rgba(232, 162, 190, 0.2);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            text-align: center;
            border: 3px solid var(--pink-accent);
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
}
        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 800;
            color: var(--red-accent);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--pink-accent);
            margin-bottom: 20px;
        }

        .info-badge {
            background-color: var(--yellow-accent);
            color: var(--text-main);
            font-size: 13px;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 25px;
            line-height: 1.4;
            text-align: left;
            border-left: 4px solid var(--red-accent);
        }

        .upload-zone {
            border: 2px dashed var(--blue-accent);
            padding: 25px 20px;
            border-radius: 12px;
            background: #fafbff;
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-zone:hover {
            border-color: var(--pink-accent);
            background: #fff5f8;
        }

        input[type="file"] {
            font-size: 14px;
            color: var(--text-muted);
        }

        button {
            background-color: var(--red-accent);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: transform 0.1s ease, background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 92, 92, 0.3);
        }

        button:hover {
            background-color: #fa4444;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Displays your custom logo image -->
        <img src="../static/logo.png" alt="C.A.R.E. Logo" class="logo-img">
        
        <h1>C.A.R.E.</h1>
        <div class="subtitle">Combating AI Reverse Engineering</div>
        
        <div class="info-badge">
            <strong>IP Protection Active:</strong> Upload your source file to safely embed structural prompt-injection directives and protect your work.
        </div>
        
        <form action="/process" method="POST" enctype="multipart/form-data">
            <div class="upload-zone">
                <input type="file" name="code_file" required>
            </div>
            <button type="submit">Process & Download Proofed File</button>
        </form>
    </div>

</body>
</html>
